name: Forus (fka Tandem Health)
description: 'Forus (formerly Tandem Health) is a US healthcare technology company building an AI-powered
  network that connects doctors, pharmacies, payers, and biopharma to bring new therapies to patients.
  Its platform automates the medication-access workflow end to end: prior authorization submissions,
  appeal-letter generation, insurance enrollment forms, benefit verification, pharmacy routing, patient
  status communication, PA renewal tracking, and affordability-program enrollment. It integrates with
  major EHRs so prescribers can submit directly, covers any drug/plan/pharmacy across all 50 states, and
  is HIPAA-compliant and SOC 2 Type II certified. The company publishes an engineering blog at
  build.forus.com but does not currently expose a public developer API. Backed by Bain Capital Ventures.'
